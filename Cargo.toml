[workspace]
resolver = "2"
members = [
    "crates/stacklens-cli",
    "crates/stacklens-core",
    "crates/stacklens-system",
]
default-members = ["crates/stacklens-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
stacklens-core = { path = "crates/stacklens-core" }
stacklens-system = { path = "crates/stacklens-system" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
