[workspace]
resolver = "2"
members = [
    "crates/stacklens-cli",
    "crates/stacklens-core",
    "crates/stacklens-cuda",
    "crates/stacklens-nvidia",
    "crates/stacklens-system",
]
default-members = ["crates/stacklens-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# clap 4.6 / clap_lex 1.1 require edition 2024 (Rust 1.85+). 1.80 cannot build the lockfile.
rust-version = "1.85"

[workspace.dependencies]
stacklens-core = { path = "crates/stacklens-core" }
stacklens-system = { path = "crates/stacklens-system" }
stacklens-cuda = { path = "crates/stacklens-cuda" }
stacklens-nvidia = { path = "crates/stacklens-nvidia" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
